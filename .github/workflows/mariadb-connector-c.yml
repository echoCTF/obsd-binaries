name: mariadb-connector-c

on:
  workflow_dispatch:
    inputs:
      mariadb_connector:
        description: "mariadb-connector-c version for the source tarball build (git tag without the leading v)"
        required: false
        default: "3.4.11"
        type: string
      revision:
        description: "Package REVISION (pN suffix) for the port build. Leave empty to use the REVISION from the port Makefile."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  MARIADB_CONNECTOR: ${{ inputs.mariadb_connector || '3.4.11' }}
  OPENBSD: "7.9"

jobs:
  mariadb-connector-c:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - name: Check for an existing release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=mariadb-connector-c-${{ env.MARIADB_CONNECTOR }}-openbsd-${{ env.OPENBSD }}
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.exists != 'true'
        with:
          repository: mariadb-corporation/mariadb-connector-c
          ref: v${{ env.MARIADB_CONNECTOR }}
          submodules: recursive
          persist-credentials: false

      - uses: cross-platform-actions/action@v1.6.0
        if: steps.check.outputs.exists != 'true'
        with:
          operating_system: openbsd
          architecture: x86-64
          version: ${{ env.OPENBSD }}

      - name: Build
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo pkg_add cmake gmake
          sed -i 's/Werror/w/g' CMakeLists.txt
          cmake . -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_C_FLAGS="-Wall"
          gmake
          sudo gmake install DESTDIR=/tmp/stage
          sudo tar czf mariadb-connector-c-${{ env.MARIADB_CONNECTOR }}-openbsd-${{ env.OPENBSD }}-amd64.tar.gz -C /tmp/stage usr

      - name: Release
        if: steps.check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create mariadb-connector-c-${{ env.MARIADB_CONNECTOR }}-openbsd-${{ env.OPENBSD }} \
            mariadb-connector-c-${{ env.MARIADB_CONNECTOR }}-openbsd-${{ env.OPENBSD }}-amd64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "mariadb-connector-c ${{ env.MARIADB_CONNECTOR }} (OpenBSD ${{ env.OPENBSD }})" \
            --notes "https://github.com/mariadb-corporation/mariadb-connector-c/tree/v${{ env.MARIADB_CONNECTOR }} ($(git rev-parse HEAD))"

  # The package gets its own release, versioned from the port Makefile
  # (GH_TAGNAME + REVISION), so it never has to upload into the tarball's
  # release and a new revision always gets a fresh tag.
  mariadb-connector-c-pkg:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for an existing release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          mk=ports/databases/mariadb-connector-c/Makefile
          v=$(awk '/^GH_TAGNAME[ \t]*=/ {sub(/^v/, "", $3); print $3}' $mk)
          r=$(awk '/^REVISION[ \t]*=/ {print $3}' $mk)
          if [ -n "$INPUT_REVISION" ]; then
            if ! [[ "$INPUT_REVISION" =~ ^[0-9]+$ ]]; then
              echo "revision must be a non-negative integer, got: $INPUT_REVISION" >&2
              exit 1
            fi
            r=$INPUT_REVISION
          fi
          [ -n "$r" ] && v="${v}p${r}"
          tag=mariadb-connector-c-$v-openbsd-${{ env.OPENBSD }}-pkg
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "revision=$r" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Must match the package's own name, or pkg_add fails with
          # "Package name is not consistent".
          echo "asset=mariadb-connector-c-$v.tgz" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cross-platform-actions/action@v1.6.0
        if: steps.check.outputs.exists != 'true'
        with:
          operating_system: openbsd
          architecture: x86-64
          version: ${{ env.OPENBSD }}

      - name: Build package
        if: steps.check.outputs.exists != 'true'
        run: |
          set -e
          ws=$PWD
          rev="${{ steps.check.outputs.revision }}"
          mkargs=""
          [ -n "$rev" ] && mkargs="REVISION=$rev"
          sudo pkg_add cmake ninja
          url=$(cat /etc/installurl)/$(uname -r)
          cd /tmp
          ftp -o ports.tar.gz $url/ports.tar.gz
          ftp -o SHA256.sig $url/SHA256.sig
          signify -Cp /etc/signify/openbsd-$(uname -r | cut -c 1,3)-base.pub -x SHA256.sig ports.tar.gz
          sudo tar xzf ports.tar.gz -C /usr
          sudo mkdir -p /usr/ports/mystuff
          sudo cp -R $ws/ports/. /usr/ports/mystuff/
          cd /usr/ports/mystuff/databases/mariadb-connector-c
          [ -f distinfo ] || { sudo make makesum; cat distinfo; }
          sudo make package $mkargs
          cp /usr/ports/packages/amd64/all/${{ steps.check.outputs.asset }} $ws/
          ls -l $ws/${{ steps.check.outputs.asset }}

      - name: Release
        if: steps.check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" ${{ steps.check.outputs.asset }} \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "mariadb-connector-c ${{ steps.check.outputs.version }} package (OpenBSD ${{ env.OPENBSD }})" \
            --notes "Built from ports/databases/mariadb-connector-c at $GITHUB_SHA. Install with: pkg_add -D unsigned ./${{ steps.check.outputs.asset }}"
