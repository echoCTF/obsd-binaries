name: registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: "distribution version to build (git tag without the leading v, last: 3.1.2)"
        required: true
        default: "3.1.2"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: registry
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: distribution/distribution
          ref: v${{ inputs.version }}
          path: distribution
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          path: self
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Build and release
        working-directory: distribution
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag=registry-$VERSION
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag exists, skipping"
            exit 0
          fi
          git apply ../self/patches/registry/openbsd-keepalive.patch
          CGO_ENABLED=0 GOOS=openbsd GOARCH=amd64 go build -trimpath -ldflags "-s -w" \
            -o registry-openbsd-amd64 ./cmd/registry
          zip registry-openbsd-amd64.zip registry-openbsd-amd64
          gh release create "$tag" registry-openbsd-amd64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "registry $VERSION" \
            --notes "https://github.com/distribution/distribution/tree/v$VERSION ($(git rev-parse HEAD)), patched with patches/registry/openbsd-keepalive.patch"
