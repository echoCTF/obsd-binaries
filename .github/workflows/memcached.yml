name: memcached

on:
  workflow_dispatch:
  push:
    paths:
      - ports/misc/memcached/**
      - .github/workflows/memcached.yml

permissions:
  contents: read

jobs:
  memcached-pkg:
    name: memcached (OpenBSD ${{ matrix.openbsd }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        openbsd: ["7.9", "8.0"]
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for an existing release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mk=ports/misc/memcached/Makefile
          v=$(awk '/^DISTNAME=/ {sub(/^memcached-/, "", $2); print $2}' $mk)
          r=$(awk '/^REVISION=/ {print $2}' $mk)
          [ -n "$r" ] && v="${v}p${r}"
          tag=memcached-$v-openbsd-${{ matrix.openbsd }}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cross-platform-actions/action@v1.7.0
        if: steps.check.outputs.exists != 'true'
        with:
          operating_system: openbsd
          architecture: x86-64
          version: ${{ matrix.openbsd }}

      - name: Build package
        if: steps.check.outputs.exists != 'true'
        run: |
          set -e
          ws=$PWD
          sudo pkg_add libevent
          url=$(cat /etc/installurl)/$(uname -r)
          cd /tmp
          ftp -o ports.tar.gz $url/ports.tar.gz
          ftp -o SHA256.sig $url/SHA256.sig
          signify -Cp /etc/signify/openbsd-$(uname -r | cut -c 1,3)-base.pub -x SHA256.sig ports.tar.gz
          sudo tar xzf ports.tar.gz -C /usr
          sudo mkdir -p /usr/ports/mystuff/misc
          sudo rm -rf /usr/ports/mystuff/misc/memcached
          sudo cp -R $ws/ports/misc/memcached /usr/ports/mystuff/misc/
          cd /usr/ports/mystuff/misc/memcached
          sudo make package
          cp /usr/ports/packages/amd64/all/memcached-*.tgz $ws/
          ls -l $ws/memcached-*.tgz

      - name: Release
        if: steps.check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" memcached-*.tgz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "memcached ${{ steps.check.outputs.version }} (OpenBSD ${{ matrix.openbsd }})" \
            --notes "Built from ports/misc/memcached at $GITHUB_SHA. Install with: pkg_add -D unsigned ./memcached-${{ steps.check.outputs.version }}.tgz"
