name: memcached

on:
  workflow_dispatch:
    inputs:
      openbsd:
        description: "OpenBSD release to build ports/misc/memcached for (last: 1.6.42p1)"
        required: true
        default: all
        type: choice
        options:
          - all
          - "7.9"
          - "8.0"
      revision:
        description: "Package REVISION, e.g. 0 or p0. Leave empty to use the REVISION from the port Makefile."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  memcached-pkg:
    name: memcached (OpenBSD ${{ matrix.openbsd }})
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        openbsd: ${{ fromJSON(inputs.openbsd == 'all' && '["7.9", "8.0"]' || format('["{0}"]', inputs.openbsd)) }}
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for an existing release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          mk=ports/misc/memcached/Makefile
          v=$(awk '/^DISTNAME=/ {sub(/^memcached-/, "", $2); print $2}' $mk)
          r=$(awk '/^REVISION=/ {print $2}' $mk)
          INPUT_REVISION=${INPUT_REVISION#p}
          if [ -n "$INPUT_REVISION" ]; then
            if ! [[ "$INPUT_REVISION" =~ ^[0-9]+$ ]]; then
              echo "revision must be a non-negative integer, got: $INPUT_REVISION" >&2
              exit 1
            fi
            r=${INPUT_REVISION#p}
          fi
          [ -n "$r" ] && v="${v}p${r}"
          tag=memcached-$v-openbsd-${{ matrix.openbsd }}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "revision=$r" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=memcached-$v.tgz" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag exists, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cross-platform-actions/action@v1.7.0
        if: steps.check.outputs.exists != 'true'
        with:
          operating_system: openbsd
          architecture: x86-64
          version: ${{ matrix.openbsd }}

      - name: Build package
        if: steps.check.outputs.exists != 'true'
        run: |
          set -e
          ws=$PWD
          rev="${{ steps.check.outputs.revision }}"
          mkargs=""
          [ -n "$rev" ] && mkargs="REVISION=$rev"
          sudo pkg_add libevent
          url=$(cat /etc/installurl)/$(uname -r)
          cd /tmp
          ftp -o ports.tar.gz $url/ports.tar.gz
          ftp -o SHA256.sig $url/SHA256.sig
          signify -Cp /etc/signify/openbsd-$(uname -r | cut -c 1,3)-base.pub -x SHA256.sig ports.tar.gz
          sudo tar xzf ports.tar.gz -C /usr
          sudo mkdir -p /usr/ports/mystuff/misc
          sudo rm -rf /usr/ports/mystuff/misc/memcached
          sudo cp -R $ws/ports/misc/memcached /usr/ports/mystuff/misc/
          cd /usr/ports/mystuff/misc/memcached
          sudo make package $mkargs
          cp /usr/ports/packages/amd64/all/${{ steps.check.outputs.asset }} $ws/
          ls -l $ws/${{ steps.check.outputs.asset }}

      - name: Release
        if: steps.check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" ${{ steps.check.outputs.asset }} \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "memcached ${{ steps.check.outputs.version }} (OpenBSD ${{ matrix.openbsd }})" \
            --notes "Built from ports/misc/memcached at $GITHUB_SHA. Install with: pkg_add -D unsigned ./${{ steps.check.outputs.asset }}"
