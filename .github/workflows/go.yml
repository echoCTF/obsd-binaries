name: go

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build (last: mysqld_exporter 0.20.0, memcached_exporter 0.17.0)"
        required: true
        default: mysqld_exporter
        type: choice
        options:
          - mysqld_exporter
          - memcached_exporter
      version:
        description: "Version to build (git tag without the leading v)"
        required: true
        default: "0.20.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ${{ inputs.package }}
            repo: prometheus/${{ inputs.package }}
            version: ${{ inputs.version }}
            package: ${{ inputs.package == 'memcached_exporter' && './cmd/memcached_exporter' || '.' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: v${{ matrix.version }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ matrix.name }}-${{ matrix.version }}
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag exists, skipping"
            exit 0
          fi
          CGO_ENABLED=0 GOOS=openbsd GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/prometheus/common/version.Version=${{ matrix.version }} -X github.com/prometheus/common/version.Revision=$(git rev-parse HEAD)" \
            -o ${{ matrix.name }}-openbsd-amd64 ${{ matrix.package }}
          zip ${{ matrix.name }}-openbsd-amd64.zip ${{ matrix.name }}-openbsd-amd64
          gh release create "$tag" ${{ matrix.name }}-openbsd-amd64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${{ matrix.name }} ${{ matrix.version }}" \
            --notes "https://github.com/${{ matrix.repo }}/tree/v${{ matrix.version }} ($(git rev-parse HEAD))"
