name: go

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysqld_exporter
            repo: prometheus/mysqld_exporter
            version: "0.20.0"
            package: .
          - name: memcached_exporter
            repo: prometheus/memcached_exporter
            version: "0.17.0"
            package: ./cmd/memcached_exporter
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: v${{ matrix.version }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ matrix.name }}-${{ matrix.version }}
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $tag exists, skipping"
            exit 0
          fi
          CGO_ENABLED=0 GOOS=openbsd GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/prometheus/common/version.Version=${{ matrix.version }} -X github.com/prometheus/common/version.Revision=$(git rev-parse HEAD)" \
            -o ${{ matrix.name }}-openbsd-amd64 ${{ matrix.package }}
          zip ${{ matrix.name }}-openbsd-amd64.zip ${{ matrix.name }}-openbsd-amd64
          gh release create "$tag" ${{ matrix.name }}-openbsd-amd64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${{ matrix.name }} ${{ matrix.version }}" \
            --notes "https://github.com/${{ matrix.repo }}/tree/v${{ matrix.version }} ($(git rev-parse HEAD))"
